name: Release

# Every branch, not just main and pull requests: work lands on main directly as
# often as it arrives through one, so a check that only runs on main is a check
# that runs after the fact.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Write access is granted only to the jobs that create releases
permissions:
  contents: read

# Keyed on the branch rather than the ref, so the push event and the pull
# request event for one branch share a group instead of running the same checks
# twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build:prod

      - name: Create release artifact
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cd dist && zip -r ../amp-media-player-$VERSION.zip .

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: amp-media-player-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    # The one job that writes: it creates and deletes releases and tags.
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Delete previous dev release
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete dev --yes || true
          git push --delete origin refs/tags/dev || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: release-package
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v3.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref == 'refs/heads/main' && 'dev' || github.ref_name }}
          name: ${{ github.ref == 'refs/heads/main' && 'dev' || github.ref_name }}
          body: ${{ github.ref == 'refs/heads/main' && 'Latest build from main branch' || '' }}
          make_latest: ${{ github.ref == 'refs/heads/main' && 'false' || 'true' }}
          files: artifacts/amp-media-player-*.zip
