name: Release

# Every branch, not just main and pull requests: work lands on main directly as
# often as it arrives through one, so a check that only runs on main is a check
# that runs after the fact.
on:
  push:
    branches: ["**"]
    # Release versions only, the same set protect-release-tags guards.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Write access is granted only to the jobs that create releases
permissions:
  contents: read

# Keyed on the branch rather than the ref, so a re-push to one branch cancels
# its own earlier run and not another branch's. Keyed by the event as well: a
# cancelled run leaves its check runs on the head commit, and GitHub counts
# those against the required checks, so a push and its pull request cancelling
# each other would block the merge.
# Qualified by the repository the branch lives in, since a fork names its
# branches itself: two pull requests from different forks would otherwise share
# a group whenever they pick the same branch name.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Publishing waits on the scan as well: a release is a durable artifact, and
  # taking an attribution back off after one is cut means rewriting history that
  # has already been published. Called only where a release can follow, since
  # the scan workflow already runs on every push and pull request of its own
  # accord.
  attributions:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    uses: ./.github/workflows/ai-attributions.yml

  # Publishing waits on the same checks that guard main. Called only where a
  # release can follow, since the Test workflow already runs on every push and
  # pull request of its own accord, and the jobs below are gated the same way.
  test:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    uses: ./.github/workflows/test.yml

  build:
    name: Build
    runs-on: ubuntu-latest
    # Capped well under the six-hour default: nothing here runs longer than
    # six minutes, so a job still going at fifteen has hung rather than failed.
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # Nothing in this job uses the token, so it is not left
          # in .git/config for a later step to read.
          persist-credentials: false

      - name: Set up Docker
        uses: docker/setup-docker-action@v5.7.0
        with:
          version: v29.9.3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          version: v0.38.2
          driver: docker

      - name: Build
        run: |
          set -euo pipefail
          checkout_root=$(pwd -P)
          [[ ${GITHUB_SHA:?} =~ ^[0-9a-f]{40}$ ]]
          expected_revision=$(git rev-parse "${GITHUB_SHA}^{commit}")
          test "$GITHUB_SHA" = "$expected_revision"
          test "$(git rev-parse HEAD)" = "$expected_revision"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git ls-files --error-unmatch .nvmrc package.json package-lock.json >/dev/null
          node_version=$(sed 's/^v//' .nvmrc)
          [[ "$node_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          stock_scratch=$(mktemp -d "${RUNNER_TEMP:?}/stock-node.XXXXXXXX")
          mkdir "${stock_scratch}/source" "${stock_scratch}/scratch"
          chmod 755 "${stock_scratch}/source"
          chmod 1777 "${stock_scratch}/scratch"
          excluded() {
              case "${1,,}" in
                  /*|..|../*|*/../*|*/..|.git|.git/*|*/.git|*/.git/*) return 0 ;;
                  agents.md|*/agents.md|claude.md|*/claude.md|claude.local.md|*/claude.local.md|gemini.md|*/gemini.md) return 0 ;;
                  .env|.env.*|*/.env|*/.env.*|*.env|.dev.vars|.dev.vars.*|*/.dev.vars|*/.dev.vars.*) return 0 ;;
                  .npmrc|*/.npmrc|.pypirc|*/.pypirc|.netrc|*/.netrc|.git-credentials|*/.git-credentials|.private/*|*/.private/*|.ssh/*|*/.ssh/*|.aws/*|*/.aws/*) return 0 ;;
                  credentials|credentials.*|*/credentials|*/credentials.*|*.pem|*.key|*.crt|*.cer|*.p12|*.pfx|*.age|*.gpg|*.sops.*) return 0 ;;
              esac
              return 1
          }
          git ls-files --cached -z > "${stock_scratch}/tracked.list"
          while IFS= read -r -d '' path; do
              if excluded "$path"; then continue; fi
              if [[ ! -f "$path" || -L "$path" ]]; then
                  printf 'Source must be a regular non-symlink file: %s\n' "$path" >&2
                  exit 2
              fi
              resolved=$(realpath -e -- "$path")
              case "$resolved" in
                  "$checkout_root"/*) ;;
                  *) printf 'Source path escapes checkout: %s\n' "$path" >&2; exit 2 ;;
              esac
              relative=${resolved#"$checkout_root/"}
              if excluded "$relative"; then
                  printf 'Source resolves to an excluded location: %s\n' "$path" >&2
                  exit 2
              fi
              printf '%s\0' "$path"
          done < "${stock_scratch}/tracked.list" > "${stock_scratch}/source.list"
          tar --create --file "${stock_scratch}/source.tar" --null --verbatim-files-from --no-recursion --files-from "${stock_scratch}/source.list"
          tar --extract --file "${stock_scratch}/source.tar" --directory "${stock_scratch}/source" --no-same-owner
          chmod -R u+rwX,go+rX "${stock_scratch}/source"
          source_revision=$(git rev-parse HEAD)
          source_epoch=$(git show -s --format=%ct HEAD)
          source_hash=$(sha256sum "${stock_scratch}/source.tar" | cut -d ' ' -f1)
          source_dirty=false
          if [ -n "$(git status --porcelain=v1 --untracked-files=all)" ]; then source_dirty=true; fi
          test "$source_revision" = "$GITHUB_SHA"
          test "$source_dirty" = false
          source_before=$(git status --porcelain=v1 --untracked-files=all; git rev-parse HEAD; git diff HEAD --binary | sha256sum; sha256sum "${stock_scratch}/source.tar")
          docker run --rm --read-only --user 19001:19001 \
              --cpus 4 --memory 4g --pids-limit 512 --ulimit nofile=256:256 \
              --cap-drop ALL --security-opt no-new-privileges \
              --tmpfs /tmp:rw,nosuid,mode=1777 \
              --mount "type=bind,source=${stock_scratch}/source,target=/source,readonly" \
              --mount "type=bind,source=${stock_scratch}/scratch,target=/scratch" \
              --env HOME=/scratch/home --env TMPDIR=/scratch \
              --env "CHECK_REVISION=${source_revision}" --env "CHECK_SOURCE_SHA256=${source_hash}" \
              --env "CHECK_SOURCE_DIRTY=${source_dirty}" --env "SOURCE_DATE_EPOCH=${source_epoch}" \
              "node:${node_version}" /bin/sh -ec '
              mkdir -p /scratch/work /scratch/home
              cp -R /source/. /scratch/work/
              cd /scratch/work
              git config --global url.https://github.com/.insteadOf ssh://git@github.com/
              git config --global --add url.https://github.com/.insteadOf git@github.com:
              HUSKY=0 npm ci --ignore-scripts --maxsockets=1 --legacy-peer-deps --no-audit --no-fund
              npm run build:prod
          '
          source_after=$(git status --porcelain=v1 --untracked-files=all; git rev-parse HEAD; git diff HEAD --binary | sha256sum; sha256sum "${stock_scratch}/source.tar")
          test "$source_before" = "$source_after"
          test -z "$(git ls-files -- dist)"
          test -z "$(git ls-tree -r --name-only HEAD -- dist)"
          git check-ignore --quiet --no-index dist/
          test ! -e dist
          test ! -L dist
          test -z "$(find "${stock_scratch}/scratch/work/dist" ! -type f ! -type d -print -quit)"
          cp -R "${stock_scratch}/scratch/work/dist" dist

      - name: Create release artifact
        run: |
          VERSION=$(jq -r .version package.json)
          cd dist && zip -r "../amp-media-player-$VERSION.zip" .

      - name: Upload release artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-package
          path: amp-media-player-*.zip

  release:
    needs: [build, test, attributions]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    # The one job that writes: it publishes releases and moves the `dev` tag.
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Download release artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: release-package
          path: artifacts

      # `dev` is a moving target, so its asset carries no version: the URL a
      # consumer fetches stays the same across re-cuts, and each upload replaces
      # its predecessor instead of accumulating beside the one before it.
      - name: Name the dev asset without its version
        if: github.ref == 'refs/heads/main'
        run: mv artifacts/amp-media-player-*.zip artifacts/amp-media-player-dev.zip

      # A release follows its tag, and updating one below does not move the tag
      # GitHub already has, so `dev` has to be repointed here or the release's
      # commit link and source archives would describe an older build than the
      # assets beside them. Unmasked on purpose: a rejected tag push (tag
      # protection, or credentials the checkout did not persist) has to fail
      # the job rather than quietly publish binaries with the wrong commit.
      - name: Move the dev tag to this commit
        if: github.ref == 'refs/heads/main'
        run: |
          git tag --force dev
          git push --force origin refs/tags/dev

      # Updated in place rather than deleted and recreated. Deleting first left
      # `dev` a 404 for the length of the upload, and permanently if the run
      # died in between; every asset name here is deterministic, so each upload
      # replaces its predecessor and nothing from the previous cut survives.
      - name: Publish release
        uses: softprops/action-gh-release@v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref == 'refs/heads/main' && 'dev' || github.ref_name }}
          name: ${{ github.ref == 'refs/heads/main' && 'dev' || github.ref_name }}
          body: ${{ github.ref == 'refs/heads/main' && 'Latest build from main branch' || '' }}
          generate_release_notes: ${{ github.ref != 'refs/heads/main' }}
          make_latest: ${{ github.ref == 'refs/heads/main' && 'false' || 'true' }}
          files: artifacts/amp-media-player-*.zip
